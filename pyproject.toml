[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arbo-core"
version = "0.1.0"
description = "Core de dados e validação para pesquisa espaço-temporal de dengue por RA do DF"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
]

[project.optional-dependencies]
baseline = ["scikit-learn>=1.5", "xgboost>=2.0"]
chronos = ["chronos-forecasting>=2.0"]
gnn = ["torch>=2.3", "torch-geometric>=2.5"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
